{{define "console"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rescuarr</title>
</head>
<body>
  <main>
    <h1>Rescuarr</h1>
    <p>Recovery mode <strong>{{.Mode}}</strong></p>
    {{if .Reconcile}}<p>Upstream reconciliation is required after restore.</p>{{end}}
    <form method="post" action="{{.Logout}}">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit">Sign out</button>
    </form>
  </main>
</body>
</html>
{{end}}
