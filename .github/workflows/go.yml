name: Go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: ${{ hashFiles('go.sum') != '' }}
      - name: Check gofmt
        shell: bash
        run: |
          files=$(git ls-files -- '*.go' | xargs -r gofmt -l)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -o "$RUNNER_TEMP/rescuarr" ./cmd/rescuarr
        env:
          CGO_ENABLED: '0'
