name: Upstream lab

on:
  pull_request:
    paths:
      - test/lab/**
      - internal/arradapter/**
      - internal/observe/**
      - .github/workflows/upstream-lab.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: Disposable upstream scenario to run
        type: choice
        default: reads
        options:
          - reads
          - sonarr/import
          - sonarr/v5-id-import
          - sonarr/v5-empty-pack
          - sonarr/v5-adapter-pack
          - sonarr/v5-language-pack
          - sonarr/v5-manual-copy
          - radarr/import
          - sonarr/reject-preserve
          - radarr/reject-preserve
          - sonarr/reject-remove
          - radarr/reject-remove
          - sonarr/reject-lost-response
          - radarr/reject-lost-response
          - sonarr/replace-terminal
          - radarr/replace-terminal

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check offline fixtures
        run: python3 -B -m unittest discover -s test/lab -p 'test_*.py'
      - name: Install synthetic media tools
        if: github.event_name == 'workflow_dispatch' && inputs.scenario != 'reads'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg openssl
          ffmpeg -version
          openssl version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'workflow_dispatch' && (inputs.scenario == 'sonarr/v5-adapter-pack' || inputs.scenario == 'sonarr/v5-manual-copy')
        with:
          go-version-file: go.mod
      - name: Run isolated upstream lab
        env:
          RESCUARR_SCENARIO: ${{ inputs.scenario || 'reads' }}
        shell: bash
        run: |
          if [[ "$RESCUARR_SCENARIO" == reads ]]; then
            test/lab/run.sh "$RUNNER_TEMP/rescuarr-upstream-lab.json"
          else
            test/lab/run.sh "$RUNNER_TEMP/rescuarr-upstream-lab.json" "$RESCUARR_SCENARIO"
          fi
      - name: Show sanitised evidence
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/rescuarr-upstream-lab.json" ]]; then
            cat "$RUNNER_TEMP/rescuarr-upstream-lab.json"
          fi
      - name: Attach lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-lab-evidence
          path: ${{ runner.temp }}/rescuarr-upstream-lab.json
          if-no-files-found: warn

  sonarr-v5:
    # Exercise the new scenario on the unmerged PR head as well as via dispatch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [v5-id-import, v5-empty-pack, v5-adapter-pack, v5-language-pack, v5-manual-copy]
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install synthetic media tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg openssl
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.scenario == 'v5-adapter-pack' || matrix.scenario == 'v5-manual-copy'
        with:
          go-version-file: go.mod
      - name: Run the isolated Sonarr 5 scenario
        env:
          RESCUARR_SCENARIO: ${{ matrix.scenario }}
        run: test/lab/run.sh "$RUNNER_TEMP/rescuarr-sonarr-v5.json" "sonarr/$RESCUARR_SCENARIO"
      - name: Show sanitised Sonarr 5 evidence
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/rescuarr-sonarr-v5.json" ]]; then
            cat "$RUNNER_TEMP/rescuarr-sonarr-v5.json"
          fi
      - name: Attach Sonarr 5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonarr-${{ matrix.scenario }}-evidence
          path: ${{ runner.temp }}/rescuarr-sonarr-v5.json
          if-no-files-found: warn
