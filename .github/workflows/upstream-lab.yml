name: Upstream lab

on:
  pull_request:
    paths:
      - test/lab/**
      - .github/workflows/upstream-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check offline fixtures
        run: python3 -B -m unittest discover -s test/lab -p 'test_*.py'
      - name: Run isolated upstream lab
        run: test/lab/run.sh "$RUNNER_TEMP/rescuarr-upstream-lab.json"
      - name: Attach lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-lab-evidence
          path: ${{ runner.temp }}/rescuarr-upstream-lab.json
          if-no-files-found: warn
