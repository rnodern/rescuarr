name: Windows upstream lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - test/lab/**
      - internal/arradapter/**
      - internal/observe/**
      - internal/observeservice/**
      - internal/recoveryservice/**
      - internal/webconsole/**
      - internal/store/**
      - cmd/rescuarr/**
      - .github/workflows/windows-upstream-lab.yml

permissions:
  contents: read

jobs:
  empty-pack:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        driver: [adapter, manual, language, manual-copy, normal-settings-copy, normal-settings-manual-copy, automatic-copy]
    defaults:
      run:
        shell: pwsh
    env:
      LAB_DRIVER: ${{ matrix.driver }}
      GOTOOLCHAIN: local
      SONARR_ARCHIVE: Sonarr.develop.5.0.0.2941.win-x64.zip
      SAB_ARCHIVE: SABnzbd-5.1.3-win64-bin.zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check offline lab fixtures
        run: python -B -m unittest discover -s test/lab -p 'test_*.py'
      - name: Prepare pinned portable binaries
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Use a disposable GitHub-hosted Windows runner.' }
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'rescuarr-windows-lab')
          Set-Location $dir.FullName
          $releases = @{
            $env:SONARR_ARCHIVE = 'https://github.com/Sonarr/Sonarr/releases/download/v5.0.0.2941/'
            $env:SAB_ARCHIVE = 'https://github.com/sabnzbd/sabnzbd/releases/download/5.1.3/'
          }
          foreach ($archive in $releases.Keys) {
            Invoke-WebRequest -Uri ($releases[$archive] + $archive) -OutFile $archive -MaximumRetryCount 2
            Get-FileHash -Algorithm SHA256 $archive
            Expand-Archive -LiteralPath $archive -DestinationPath ($archive + '.extracted')
          }
      - name: Build the Windows Go adapter probe
        if: matrix.driver == 'adapter'
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$env:RUNNER_TEMP/rescuarr-windows-lab/go-pack-probe.exe" ./test/lab/go-pack-probe
      - name: Build and verify the portable Rescuarr package
        if: matrix.driver == 'manual' || matrix.driver == 'manual-copy' || matrix.driver == 'normal-settings-manual-copy' || matrix.driver == 'automatic-copy'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rescuarr-windows-lab'
          python -B scripts/packaging/native.py --os windows --arch amd64 --version candidate --output "$dir/package"
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the portable Rescuarr package.' }
          Expand-Archive -LiteralPath "$dir/package/rescuarr-candidate-windows-amd64.zip" -DestinationPath "$dir/installed"
      - name: Seed the local synthetic indexer
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            choco install ffmpeg --yes --no-progress
          fi
          export MSYS2_ARG_CONV_EXCL='/CN='
          lab_dir="$(cygpath -u "$RUNNER_TEMP")/rescuarr-windows-lab"
          if [[ "$LAB_DRIVER" == language ]]; then
            bash test/lab/seed.sh "$lab_dir" sonarr/v5-language-pack
          else
            bash test/lab/seed.sh "$lab_dir"
          fi
          openssl x509 -in "$lab_dir/tls/root.pem" -outform der -out "$lab_dir/tls/root.cer"
      - name: Run the native Windows Sonarr and SABnzbd lab
        timeout-minutes: 12
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rescuarr-windows-lab'
          $sonarrDir = Join-Path $dir ($env:SONARR_ARCHIVE + '.extracted')
          $sabDir = Join-Path $dir ($env:SAB_ARCHIVE + '.extracted')
          $sonarr = @(Get-ChildItem $sonarrDir -Recurse -File -Filter 'Sonarr.Console.exe')
          if ($sonarr.Count -eq 0) {
            $sonarr = @(Get-ChildItem $sonarrDir -Recurse -File -Filter 'Sonarr.exe')
          }
          $sab = @(Get-ChildItem $sabDir -Recurse -File -Filter 'SABnzbd.exe')
          if ($sonarr.Count -ne 1 -or $sab.Count -ne 1) { throw 'Unexpected portable package contents.' }

          # Resolve metadata to the generated fixture only inside this ephemeral runner.
          $hosts = "$env:SystemRoot/System32/drivers/etc/hosts"
          $originalHosts = [IO.File]::ReadAllBytes($hosts)
          Write-Host 'Trusting the disposable metadata certificate'
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$dir/tls/root.cer")
          # The GitHub-hosted VM is disposable and runs this step as an administrator.
          # Machine root import avoids a current-user trust confirmation dialog.
          certutil.exe -f -addstore Root "$dir/tls/root.cer"
          if ($LASTEXITCODE -ne 0) { throw 'Could not trust the disposable metadata certificate.' }
          try {
            Add-Content -LiteralPath $hosts -Value "`r`n127.0.0.1 skyhook.sonarr.tv" -Encoding ascii
            Clear-DnsClientCache
            Write-Host 'Launching isolated Windows recovery scenario'
            $driverArgs = @(
              switch ($env:LAB_DRIVER) {
                'language' { '--language-pack' }
                'manual' { '--rescuarr'; "$dir/installed/rescuarr.exe" }
                'normal-settings-copy' { '--normal-settings-copy' }
                'normal-settings-manual-copy' { '--normal-settings-manual-copy'; "$dir/installed/rescuarr.exe" }
                'automatic-copy' { '--automatic-copy'; "$dir/installed/rescuarr.exe" }
                'manual-copy' { '--manual-copy'; "$dir/installed/rescuarr.exe" }
                'adapter' { '--adapter'; "$dir/go-pack-probe.exe" }
              }
            )
            python -B test/lab/windows_empty_pack.py --sonarr $sonarr[0].FullName --sab $sab[0].FullName `
              @driverArgs --media "$dir/media/synthetic.mkv" `
              --certificate "$dir/tls/source.pem" --key "$dir/tls/source.key" `
              --report "$env:RUNNER_TEMP/rescuarr-windows-empty-pack.json"
            if ($LASTEXITCODE -ne 0) { throw 'Windows upstream lab failed. See the sanitised evidence.' }
          } finally {
            [IO.File]::WriteAllBytes($hosts, $originalHosts)
            Clear-DnsClientCache
            Remove-Item -LiteralPath ("Cert:/LocalMachine/Root/" + $certificate.Thumbprint)
          }
      - name: Attach sanitised Windows evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: >-
            ${{ matrix.driver == 'normal-settings-manual-copy' && 'sonarr-windows-v5-manual-copy-normal-settings-evidence'
                || matrix.driver == 'normal-settings-copy' && 'sonarr-windows-v5-copy-normal-settings-evidence'
                || matrix.driver == 'manual-copy' && 'sonarr-windows-v5-manual-copy-evidence'
                || matrix.driver == 'automatic-copy' && 'sonarr-windows-v5-automatic-copy-normal-settings-evidence'
                || format('sonarr-windows-v5-{0}-pack-evidence', matrix.driver) }}
          path: ${{ runner.temp }}/rescuarr-windows-empty-pack.json
          if-no-files-found: warn
