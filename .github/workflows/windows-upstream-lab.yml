name: Windows upstream lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - test/lab/**
      - internal/arradapter/**
      - internal/observe/**
      - .github/workflows/windows-upstream-lab.yml

permissions:
  contents: read

jobs:
  empty-pack:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      SONARR_ARCHIVE: Sonarr.develop.5.0.0.2941.win-x64.zip
      SAB_ARCHIVE: SABnzbd-5.1.3-win64-bin.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check offline lab fixtures
        run: python -B -m unittest discover -s test/lab -p 'test_*.py'
      - name: Prepare pinned portable binaries
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Use a disposable GitHub-hosted Windows runner.' }
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'rescuarr-windows-lab')
          Set-Location $dir.FullName
          $releases = @{
            $env:SONARR_ARCHIVE = 'https://github.com/Sonarr/Sonarr/releases/download/v5.0.0.2941/'
            $env:SAB_ARCHIVE = 'https://github.com/sabnzbd/sabnzbd/releases/download/5.1.3/'
          }
          foreach ($archive in $releases.Keys) {
            Invoke-WebRequest -Uri ($releases[$archive] + $archive) -OutFile $archive -MaximumRetryCount 2
            Get-FileHash -Algorithm SHA256 $archive
            Expand-Archive -LiteralPath $archive -DestinationPath ($archive + '.extracted')
          }
      - name: Build the Windows Go adapter probe
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$env:RUNNER_TEMP/rescuarr-windows-lab/go-pack-probe.exe" ./test/lab/go-pack-probe
      - name: Seed the local synthetic indexer
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            choco install ffmpeg --yes --no-progress
          fi
          export MSYS2_ARG_CONV_EXCL='/CN='
          lab_dir="$(cygpath -u "$RUNNER_TEMP")/rescuarr-windows-lab"
          bash test/lab/seed.sh "$lab_dir"
          openssl x509 -in "$lab_dir/tls/root.pem" -outform der -out "$lab_dir/tls/root.cer"
      - name: Run the native Windows Sonarr and SABnzbd lab
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rescuarr-windows-lab'
          $sonarrDir = Join-Path $dir ($env:SONARR_ARCHIVE + '.extracted')
          $sabDir = Join-Path $dir ($env:SAB_ARCHIVE + '.extracted')
          $sonarr = @(Get-ChildItem $sonarrDir -Recurse -File -Filter 'Sonarr.Console.exe')
          if ($sonarr.Count -eq 0) {
            $sonarr = @(Get-ChildItem $sonarrDir -Recurse -File -Filter 'Sonarr.exe')
          }
          $sab = @(Get-ChildItem $sabDir -Recurse -File -Filter 'SABnzbd.exe')
          if ($sonarr.Count -ne 1 -or $sab.Count -ne 1) { throw 'Unexpected portable package contents.' }

          # Resolve metadata to the generated fixture only inside this ephemeral runner.
          $hosts = "$env:SystemRoot/System32/drivers/etc/hosts"
          $originalHosts = [IO.File]::ReadAllBytes($hosts)
          $certificate = Import-Certificate -FilePath "$dir/tls/root.cer" -CertStoreLocation 'Cert:/CurrentUser/Root'
          try {
            Add-Content -LiteralPath $hosts -Value "`r`n127.0.0.1 skyhook.sonarr.tv" -Encoding ascii
            Clear-DnsClientCache
            python -B test/lab/windows_empty_pack.py --sonarr $sonarr[0].FullName --sab $sab[0].FullName `
              --adapter "$dir/go-pack-probe.exe" --media "$dir/media/synthetic.mkv" `
              --certificate "$dir/tls/source.pem" --key "$dir/tls/source.key" `
              --report "$env:RUNNER_TEMP/rescuarr-windows-empty-pack.json"
            if ($LASTEXITCODE -ne 0) { throw 'Windows upstream lab failed. See the sanitised evidence.' }
          } finally {
            [IO.File]::WriteAllBytes($hosts, $originalHosts)
            Clear-DnsClientCache
            Remove-Item -LiteralPath ("Cert:/CurrentUser/Root/" + $certificate.Thumbprint)
          }
      - name: Attach sanitised Windows evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sonarr-windows-v5-adapter-pack-evidence
          path: ${{ runner.temp }}/rescuarr-windows-empty-pack.json
          if-no-files-found: warn
